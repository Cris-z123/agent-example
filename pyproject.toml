[project]
name = "agent-example"
version = "0.1.0"
description = "Agent example project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.15.0",
    "python-dotenv>=1.2.1",
    "pydantic>=2.0.0",
    "requests>=2.32.5",
    "langchain>=1.3.15",
    "langchain-openai>=1.5.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-mysql==3.0.0",
    "pymysql==1.1.2",
    "cryptography==46.0.3",
    "aiomysql==0.3.2",
    "asyncmy==0.2.11",
    "langchain-mcp-adapters>=0.3.2",
    "fastmcp>=3.4.7",
    "langgraph-cli[inmem]>=0.4.31",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.3.4",
    "deepagents>=0.7.8",
    "opensandbox>=0.1.15",
    "opensandbox-code-interpreter>=0.1.2",
    "loguru>=0.7.3",
]


[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[dependency-groups]
dev = [
    "black>=25.12.0",
    "pre-commit>=4.5.1",
    "ruff>=0.14.11",
]

[tool.ruff]
line-length = 200  # 设置每行最大长度
target-version = "py312"  # 目标Python版本

[tool.ruff.lint]
select = [
    "E",   # pycodestyle错误
    "W",   # pycodestyle警告
    "F",   # Pyflakes
    "I",   # isort (import排序)
    "B",   # flake8-bugbear
]

[tool.ruff.format]
quote-style = "double"  # 统一使用双引号

[build-system]
requires = ["setuptools>=73.0.0"] # 打包依赖：需要哪个版本的 setuptools 来构建这个包
build-backend = "setuptools.build_meta" # 指定 setuptools 的现代 API 作为构建入口

[tool.setuptools.packages.find]
where = ["src"] # 从 src/ 目录发现包（core、utils、tools、knowledge 等）
namespaces = true # 允许无 __init__.py 的命名空间包（如 utils、knowledge）
